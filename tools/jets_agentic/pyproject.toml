[project]
name = "jets_agentic"
version = "0.1.0"
description = "The jets_agentic domain model: schema-first source of the agentic entities, emitting .jr, sidecar metadata, and (via later emitters) JSON Schema, glossary and tool signatures."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.scripts]
jets-agentic = "jets_agentic.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jets_agentic"]
