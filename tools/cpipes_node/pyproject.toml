[project]
name = "cpipes_node"
version = "0.1.0"
description = "A Python compute pipes node: the entry, the config load, and the declared operator scope."
requires-python = ">=3.12"
dependencies = [
    "cpipes_contract",
    "pydantic>=2.5",
    # The parquet device writer (P9-T07). A dependency and not an extra: X3 asks
    # for every table in CSV **and** Parquet by changing `device_writer_type`
    # alone, and a format that works only where somebody remembered an extra
    # makes an exit criterion a function of the install. `writers.py` imports it
    # at the call, so a csv-only pipeline pays nothing for it at cold start.
    "pyarrow>=17",
]

[project.optional-dependencies]
# boto3 is an extra rather than a dependency because the local driver is the
# path every test takes, and a node that cannot be exercised without the AWS
# SDK installed is a node that cannot be exercised without AWS.
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

[project.scripts]
cpipes-node = "cpipes_node.main:main"

[tool.uv.sources]
cpipes_contract = { path = "../cpipes_contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpipes_node"]

[tool.pytest.ini_options]
python_files = ["tests_*.py"]
