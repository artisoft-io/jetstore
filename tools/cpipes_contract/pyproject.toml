[project]
name = "cpipes_contract"
version = "0.1.0"
description = "The cpipes config contract: the applicability matrix, its schema and the checks over it."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.21",
]

[project.scripts]
cpipes-contract = "cpipes_contract.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpipes_contract"]
