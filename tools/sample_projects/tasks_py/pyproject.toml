[project]
name = "tasks_py"
version = "1.0.0"
description = "Sample app: call a local Ollama server to turn a request into Task objects, validated with Pydantic."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.scripts]
tasks-py = "tasks_py.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasks_py"]
