<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Declared explicitly rather than left to the browser's implicit request for
      /favicon.ico at the origin root.

      Written with a leading slash so vite rewrites it with the configured base;
      a relative href would resolve against the current document and break on a
      deep client route, which is served this same html from a different path.

      **The JetStore mark rather than the editor's, since D.9 (I-267).** This was
      `favicon.svg`, and a static document cannot vary by route, so the editor's
      icon was served on all twenty-one of them. `src/shell/favicon.ts` swaps in
      `favicon.svg` on the two routes that are the editor; this line is what every
      other route gets, what a tab shows before the bundle hydrates, and what the
      unauthenticated /register route gets, that one being outside the shell and
      so out of reach of any effect. The argument for defaulting this way round —
      rather than declaring the editor's icon and swapping it out nineteen times —
      is in that module's header.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>JetStore Workspace IDE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
